    <link rel="stylesheet" crossorigin href="/assets/styles-BttdxJ6F.css">

  <body
    style="
      margin: 0;
      background: #f8fafc;
      color: #1f2937;
      font-family: &quot;Cairo&quot;, system-ui, sans-serif;
    "
  >
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then((registrations) =>
            Promise.all(registrations.map((registration) => registration.unregister())),
          )
          .catch(() => undefined);
      }

      if ("caches" in window) {
        caches
          .keys()
          .then((names) => Promise.all(names.map((name) => caches.delete(name))))
          .catch(() => undefined);
      }
    </script>
    <div id="root">
      <p style="padding: 24px; text-align: center">جاري تحميل لالة…</p>
    </div>
  </body>

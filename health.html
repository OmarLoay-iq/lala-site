<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>فحص اتصال لالة</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        color-scheme: light;
        background: #f8fafc;
        color: #1f2937;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
      }

      main {
        width: 100%;
        max-width: 420px;
        box-sizing: border-box;
        padding: 28px 22px;
        border: 1px solid #e5e7eb;
        border-radius: 24px;
        background: #ffffff;
        text-align: center;
        box-shadow: 0 12px 36px rgba(31, 41, 55, 0.08);
      }

      .mark {
        display: grid;
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        place-items: center;
        border-radius: 16px;
        background: #d73435;
        color: #ffffff;
        font-size: 26px;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        color: #15803d;
        font-size: 22px;
      }

      p {
        margin: 10px 0 0;
        color: #4b5563;
        line-height: 1.8;
      }

      code {
        display: inline-block;
        margin-top: 14px;
        padding: 6px 10px;
        border-radius: 8px;
        background: #f3f4f6;
        direction: ltr;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ل</div>
      <h1>اتصال لالة يعمل</h1>
      <p>إذا ظهرت هذه الصفحة، فقد وصل جهازك إلى الاستضافة الجديدة بنجاح.</p>
      <code>LALA-HEALTH-20260805</code>
    </main>
  </body>
</html>
